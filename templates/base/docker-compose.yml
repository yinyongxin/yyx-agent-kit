# 项目自包含的本地依赖环境（PostgreSQL + pgvector + Redis + Authentik）
# 不依赖全局 local-dev-docker-container，每个项目独立一套，多项目并存不冲突。
# 用法：
#   cp .env.example .env       # 生产务必改 AUTHENTIK_SECRET_KEY 和各密码
#   docker compose up -d
#   docker compose down          # 停止但保留数据
#   docker compose down -v       # 停止并删除数据卷（危险）
name: starter

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: starter-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app_dev_pwd}
      TZ: Asia/Shanghai
    ports:
      - "${POSTGRES_PORT:-54732}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-app}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - starter-net

  redis:
    image: redis:7-alpine
    container_name: starter-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-app_redis_pwd}
    ports:
      - "${REDIS_PORT:-46379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-app_redis_pwd}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - starter-net

  # 统一 IdP：账号密码 + Google OIDC，用户/租户中心
  # 2025.4+ 会话存 DB，不需要外部 Redis；只连同一个 PostgreSQL 的 authentik 库
  authentik-server:
    image: ghcr.io/goauthentik/server:2026.8.6
    container_name: starter-authentik-server
    restart: unless-stopped
    command: server
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AUTHENTIK_POSTGRESQL__HOST: postgres
      AUTHENTIK_POSTGRESQL__PORT: 5432
      AUTHENTIK_POSTGRESQL__NAME: ${AUTHENTIK_DB_NAME:-authentik}
      AUTHENTIK_POSTGRESQL__USER: ${AUTHENTIK_DB_USER:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_DB_PASSWORD:-authentik_dev_pwd}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?AUTHENTIK_SECRET_KEY required}
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
    ports:
      - "${AUTHENTIK_PORT:-9000}:9000"
    volumes:
      - authentik-data:/data
    networks:
      - starter-net

  authentik-worker:
    image: ghcr.io/goauthentik/server:2026.8.6
    container_name: starter-authentik-worker
    restart: unless-stopped
    command: worker
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AUTHENTIK_POSTGRESQL__HOST: postgres
      AUTHENTIK_POSTGRESQL__PORT: 5432
      AUTHENTIK_POSTGRESQL__NAME: ${AUTHENTIK_DB_NAME:-authentik}
      AUTHENTIK_POSTGRESQL__USER: ${AUTHENTIK_DB_USER:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_DB_PASSWORD:-authentik_dev_pwd}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?AUTHENTIK_SECRET_KEY required}
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
    volumes:
      - authentik-data:/data
    networks:
      - starter-net

volumes:
  postgres-data:
    name: starter-postgres-data
  redis-data:
    name: starter-redis-data
  authentik-data:
    name: starter-authentik-data

networks:
  starter-net:
    name: starter-net
    driver: bridge
