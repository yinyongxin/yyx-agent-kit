# 项目自包含的本地依赖环境（PostgreSQL + pgvector + Redis + Penpot 设计工具）
# 不依赖全局 local-dev-docker-container，每个项目独立一套，多项目并存不冲突。
# 认证状态（session / token / mfa / oidc）由 NestJS 官方认证包存进 PostgreSQL，
# 不需要外部 IdP 容器；多平台共用一个 server 服务，天然共享登录态。
# Penpot 用于 PM 线稿/设计稿转代码，官方 MCP 本地模式免 key（见 tools/penpot/README.md）。
# 用法：
#   cp .env.example .env       # 生产务必改各密码与 JWT_SECRET
#   docker compose up -d
#   docker compose down          # 停止但保留数据
#   docker compose down -v       # 停止并删除数据卷（危险）
name: starter

# Penpot 官方配置片段（https://github.com/penpot/penpot/docker/images/docker-compose.yaml）
# 仅把内部服务名换成带 starter- 前缀的容器名，避免与其它项目冲突。
x-penpot-flags: &penpot-flags
  PENPOT_FLAGS: disable-email-verification enable-smtp enable-prepl-server disable-secure-session-cookies
x-penpot-uri: &penpot-public-uri
  PENPOT_PUBLIC_URI: http://localhost:${PENPOT_PORT:-9001}
x-penpot-body: &penpot-http-body-size
  PENPOT_HTTP_SERVER_MAX_BODY_SIZE: 367001600
  PENPOT_HTTP_SERVER_MAX_MULTIPART_BODY_SIZE: 367001600
x-penpot-secret: &penpot-secret-key
  PENPOT_SECRET_KEY: ${PENPOT_SECRET_KEY:-change-this-insecure-key}
x-penpot-db: &penpot-database
  PENPOT_DATABASE_URI: postgresql://starter-penpot-postgres/penpot
  PENPOT_DATABASE_USERNAME: penpot
  PENPOT_DATABASE_PASSWORD: ${PENPOT_DB_PASSWORD:-penpot}

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: starter-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app_dev_pwd}
      TZ: Asia/Shanghai
    ports:
      - "${POSTGRES_PORT:-54732}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-app}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - starter-net

  redis:
    image: redis:7-alpine
    container_name: starter-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-app_redis_pwd}
    ports:
      - "${REDIS_PORT:-46379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-app_redis_pwd}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - starter-net

  # ===== Penpot（设计工具，与本地依赖一起启动）=====
  penpot-frontend:
    image: "penpotapp/frontend:${PENPOT_VERSION:-2.18}"
    container_name: starter-penpot-frontend
    restart: unless-stopped
    ports:
      - "${PENPOT_PORT:-9001}:8080"
    volumes:
      - penpot-assets:/opt/data/assets
    depends_on:
      penpot-backend:
        condition: service_started
      penpot-admin-console:
        condition: service_started
      penpot-exporter:
        condition: service_started
    networks:
      - starter-net
    environment:
      <<: [*penpot-flags, *penpot-http-body-size, *penpot-public-uri]
      PENPOT_ADMIN_CONSOLE_URI: http://starter-penpot-admin-console:3000

  penpot-backend:
    image: "penpotapp/backend:${PENPOT_VERSION:-2.18}"
    container_name: starter-penpot-backend
    restart: unless-stopped
    volumes:
      - penpot-assets:/opt/data/assets
    depends_on:
      penpot-postgres:
        condition: service_healthy
      penpot-valkey:
        condition: service_healthy
    networks:
      - starter-net
    environment:
      <<: [*penpot-flags, *penpot-public-uri, *penpot-http-body-size, *penpot-secret-key, *penpot-database]
      PENPOT_ADMIN_CONSOLE_URI: http://starter-penpot-admin-console:3000
      PENPOT_REDIS_URI: redis://starter-penpot-valkey/0
      PENPOT_OBJECTS_STORAGE_BACKEND: fs
      PENPOT_OBJECTS_STORAGE_FS_DIRECTORY: /opt/data/assets
      PENPOT_TELEMETRY_ENABLED: "true"
      PENPOT_TELEMETRY_REFERER: compose
      PENPOT_SMTP_DEFAULT_FROM: no-reply@example.com
      PENPOT_SMTP_DEFAULT_REPLY_TO: no-reply@example.com
      PENPOT_SMTP_HOST: starter-penpot-mailpit
      PENPOT_SMTP_PORT: 1025
      PENPOT_SMTP_USERNAME:
      PENPOT_SMTP_PASSWORD:
      PENPOT_SMTP_TLS: "false"
      PENPOT_SMTP_SSL: "false"

  penpot-admin-console:
    image: "penpotapp/admin-console:${PENPOT_VERSION:-2.18}"
    container_name: starter-penpot-admin-console
    restart: unless-stopped
    depends_on:
      penpot-postgres:
        condition: service_healthy
    networks:
      - starter-net
    environment:
      <<: [*penpot-public-uri, *penpot-secret-key, *penpot-database]
      PENPOT_INTERNAL_URI: http://starter-penpot-frontend:8080

  penpot-exporter:
    image: "penpotapp/exporter:${PENPOT_VERSION:-2.18}"
    container_name: starter-penpot-exporter
    restart: unless-stopped
    depends_on:
      penpot-valkey:
        condition: service_healthy
    networks:
      - starter-net
    environment:
      <<: [*penpot-flags, *penpot-secret-key, *penpot-public-uri]
      PENPOT_INTERNAL_URI: http://starter-penpot-frontend:8080
      PENPOT_REDIS_URI: redis://starter-penpot-valkey/0

  penpot-postgres:
    image: "postgres:15"
    container_name: starter-penpot-postgres
    restart: unless-stopped
    stop_signal: SIGINT
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U penpot"]
      interval: 2s
      timeout: 10s
      retries: 5
      start_period: 2s
    volumes:
      - penpot-postgres-data:/var/lib/postgresql/data
    networks:
      - starter-net
    environment:
      - POSTGRES_INITDB_ARGS=--data-checksums
      - POSTGRES_DB=penpot
      - POSTGRES_USER=penpot
      - POSTGRES_PASSWORD=${PENPOT_DB_PASSWORD:-penpot}

  penpot-valkey:
    image: valkey/valkey:8.1
    container_name: starter-penpot-valkey
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep PONG"]
      interval: 1s
      timeout: 3s
      retries: 5
      start_period: 3s
    networks:
      - starter-net
    environment:
      - VALKEY_EXTRA_FLAGS=--maxmemory 128mb --maxmemory-policy volatile-lfu

  penpot-mailpit:
    image: axllent/mailpit:v1
    container_name: starter-penpot-mailpit
    restart: unless-stopped
    expose:
      - "1025"
    ports:
      - "${PENPOT_MAILPIT_PORT:-8025}:8025"
    networks:
      - starter-net

  # ===== 可观测性（默认不启动）=====
  # docker compose --profile observability up -d
  # 日志链路：应用 JSON 日志 → logs/app.log → Alloy → Loki → Grafana / 管理端日志页
  loki:
    image: grafana/loki:${LOKI_VERSION:-3.7.11}
    container_name: starter-loki
    profiles: ["observability"]
    restart: unless-stopped
    command: -config.file=/etc/loki/config.yaml
    ports:
      - "${LOKI_PORT:-47110}:3100"
    volumes:
      - ./docker/observability/loki-config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    networks:
      - starter-net

  alloy:
    image: grafana/alloy:${ALLOY_VERSION:-v1.22.0}
    container_name: starter-alloy
    profiles: ["observability"]
    restart: unless-stopped
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
    environment:
      LOG_SERVICE_NAME: ${LOG_SERVICE_NAME:-starter-api}
      APP_ENV: ${NODE_ENV:-development}
    ports:
      - "${ALLOY_PORT:-47112}:12345"
    volumes:
      - ./docker/observability/alloy-config.alloy:/etc/alloy/config.alloy:ro
      - ./logs:/var/log/starter:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      loki:
        condition: service_started
    networks:
      - starter-net

  tempo:
    image: grafana/tempo:${TEMPO_VERSION:-2.10.10}
    container_name: starter-tempo
    profiles: ["observability"]
    restart: unless-stopped
    command: -config.file=/etc/tempo/config.yaml
    ports:
      - "${TEMPO_PORT:-47113}:3200"
      - "${TEMPO_OTLP_HTTP_PORT:-47114}:4318"
      - "${TEMPO_OTLP_GRPC_PORT:-47115}:4317"
    volumes:
      - ./docker/observability/tempo-config.yaml:/etc/tempo/config.yaml:ro
      - tempo-data:/var/tempo
    networks:
      - starter-net

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-13.2.7}
    container_name: starter-grafana
    profiles: ["observability"]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    ports:
      - "${GRAFANA_PORT:-47111}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      loki:
        condition: service_started
      tempo:
        condition: service_started
    networks:
      - starter-net

volumes:
  postgres-data:
    name: starter-postgres-data
  redis-data:
    name: starter-redis-data
  penpot-postgres-data:
    name: starter-penpot-postgres-data
  penpot-assets:
    name: starter-penpot-assets
  loki-data:
    name: starter-loki-data
  grafana-data:
    name: starter-grafana-data
  alloy-data:
    name: starter-alloy-data
  tempo-data:
    name: starter-tempo-data

networks:
  starter-net:
    name: starter-net
    driver: bridge
